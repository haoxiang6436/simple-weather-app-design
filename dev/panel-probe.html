<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>compositing probe</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1720; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    #root { position: relative; width: 1240px; height: 720px; }

    .stage { position: absolute; top: 30px; width: 280px; }
    .stage[data-mode='panel-css'] { left: 20px; }
    .stage[data-mode='panel-anime'] { left: 320px; }
    .stage[data-mode='child-css'] { left: 620px; }
    .stage[data-mode='child-anime'] { left: 920px; }

    .cap { margin-bottom: 8px; color: #8fa6b8; font-size: 12px; }

    /* 弹层面板：backdrop-filter 让它成为常驻合成层 */
    .panel {
      position: relative;
      box-sizing: border-box;
      height: 250px;
      padding: 16px 18px;
      overflow: hidden;
      border: 1px solid #2f4252;
      border-radius: 14px;
      background: rgba(18, 34, 46, 0.72);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
    }

    .inner { will-change: auto; }

    .big { color: #fff; font-size: 34px; font-weight: 700; line-height: 1; }
    .unit { margin-left: 6px; color: #8fa6b8; font-size: 12px; letter-spacing: 0.12em; }
    .txt { margin: 8px 0 0; color: #dbe6ef; font-size: 13px; line-height: 1.6; }
    .box {
      margin-top: 10px;
      padding: 6px 9px;
      border: 1px solid #3a4a58;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      color: #b9cad8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./panel-probe.js"></script>
</body>
</html>
