<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>指标卡提示文案 · 五版对照</title>
  <link rel="stylesheet" href="../src/style/font.css" />
  <style>
    /* 只用晨雾（mist）那套 token：用户截图里就是这套，字号 16px 基准，
       浮层的字体 / 内距 / 圆角 / 材质全部照抄 StatDelta.vue，改的只有字。 */
    :root {
      --font-sans: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --text-primary: #17324b;
      --text-secondary: rgba(23, 50, 75, 0.76);
      --text-muted: rgba(23, 50, 75, 0.56);
      --card-bg: rgba(255, 255, 255, 0.46);
      --card-border: rgba(23, 63, 88, 0.16);
      --tip-bg: rgba(248, 252, 255, 0.8);
      --tip-border: rgba(23, 63, 88, 0.16);
      --tip-shadow: 0 0.5rem 1.4rem -0.5rem rgba(23, 55, 77, 0.24);
      --delta-up: #a96b1d;
      --delta-down: #167da9;
      --good: #167da9;
      --radius-md: 1.125rem;
    }

    html { font-size: 16px; }

    body {
      margin: 0;
      padding: 30px 30px 34px;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: linear-gradient(152deg, #eef3f6 0%, #e2eaef 48%, #d7e2e9 100%);
      -webkit-font-smoothing: antialiased;
    }

    .sheet { width: 1040px; margin: 0 auto; }

    h1 { margin: 0 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
    .lede { margin: 0 0 4px; font-size: 12.5px; line-height: 1.7; color: var(--text-secondary); }
    .lede b { font-weight: 600; color: var(--text-primary); }

    .sec { margin-top: 22px; }
    .sec-head {
      display: flex; align-items: baseline; gap: 9px;
      margin: 0 0 2px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(23, 63, 88, 0.12);
    }
    .sec-title { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
    .sec-note { font-size: 11.5px; color: var(--text-muted); }

    /* ---- 一个方案 = 左边一张卡（浮层常开）+ 右边一句说明 ---- */
    .row {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 26px;
      align-items: start;
      padding-top: 74px;      /* 给浮层留出向上的高度 */
      margin-top: -34px;
    }

    .stat {
      position: relative;
      display: flex; flex-direction: column; gap: 0.375rem;
      padding: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      box-shadow: 0 0.75rem 1.6rem -1rem rgba(23, 55, 77, 0.22);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .stat-icon { display: block; width: 1.55rem; height: 1.55rem; color: var(--text-muted); }
    .stat-label { font-size: 0.84rem; color: var(--text-muted); }

    .stat-foot {
      position: relative;
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
    }
    .stat-value {
      font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em;
      color: var(--text-primary); line-height: 1.1;
      font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
    }
    .stat-value small { font-size: 0.52em; font-weight: 500; color: var(--text-muted); letter-spacing: normal; }
    .stat-wind { font-size: 1.72rem; }
    .stat-uv { font-size: 1.72rem; }

    .delta {
      display: inline-flex; align-items: center; gap: 0.12em;
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.01em;
      line-height: 1; font-variant-numeric: tabular-nums;
      white-space: nowrap; flex: none; color: var(--text-muted);
    }
    .delta svg { display: block; width: 0.95em; height: 0.95em; }
    .delta-num { color: var(--text-secondary); }
    .delta-unit { margin-left: 0.04em; font-size: 0.86em; font-weight: 500; color: var(--text-muted); }
    .delta.tint.up { color: var(--delta-up); }
    .delta.tint.down { color: var(--delta-down); }
    .delta.flat { color: var(--text-secondary); }

    /* ---- 浮层：材质 / 字号 / 内距与 StatDelta.vue 完全一致 ---- */
    .tip {
      position: absolute; right: 0;
      bottom: calc(100% + 0.2rem);
      z-index: 5;
      width: max-content; max-width: 15rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.72rem; font-weight: 400; letter-spacing: normal;
      line-height: 1.45; text-align: left;
      color: var(--text-primary);
      background: var(--tip-bg);
      border: 1px solid var(--tip-border);
      border-radius: 0.75rem;
      box-shadow: var(--tip-shadow);
      -webkit-backdrop-filter: blur(1.5rem);
      backdrop-filter: blur(1.5rem);
      transform-origin: 100% 100%;
    }
    .tip-body { display: flex; flex-direction: column; gap: 0.15rem; }
    .tip-sub { font-size: 0.68rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* ---- 说明列 ---- */
    .cap-side { display: flex; flex-direction: column; gap: 7px; padding-top: 12px; }
    .tag {
      align-self: flex-start;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
      padding: 2px 6px; border-radius: 4px;
      color: var(--text-secondary);
      background: rgba(23, 63, 88, 0.07);
      border: 1px solid rgba(23, 63, 88, 0.14);
    }
    .tag.now { color: #7a8794; }
    .tag.pick { color: #0f6f99; background: rgba(22, 125, 169, 0.12); border-color: rgba(22, 125, 169, 0.3); }
    .cap {
      margin: 0; font-size: 12.5px; line-height: 1.75;
      color: var(--text-secondary); max-width: 42em;
    }
    .cap b { color: var(--text-primary); font-weight: 600; }
    .cap code {
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 11.5px; color: var(--text-primary);
      background: rgba(23, 63, 88, 0.07);
      padding: 0.5px 4px; border-radius: 3px;
    }
    .why { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }

    /* ---- 全表 ---- */
    .grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 34px; padding-top: 76px; }
    .grid6 .cap-side { padding-top: 0; }

    .foot {
      margin-top: 26px; padding-top: 12px;
      border-top: 1px solid rgba(23, 63, 88, 0.12);
      font-size: 11.5px; line-height: 1.75; color: var(--text-muted);
    }
    .foot b { color: var(--text-secondary); font-weight: 600; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  </style>
</head>

<body>
  <div class="sheet">
    <h1>指标卡提示文案 · 五版对照（C 已采用）</h1>
    <p class="lede">同一张卡（<b>降雨量 6.43 mm → 周二 0.12 mm</b>），只换浮层里那两行字。浮层是常开的 hover 态，字号 / 内距 / 材质与线上一致。</p>
    <div id="variants"></div>
    <div id="full"></div>
    <div class="foot">
      <b>实现成本</b>：五版都只动 <code>statDeltas.js</code> 的 <code>tip</code> 一个字段，角的图标、颜色、精度、第二行原值、读屏句子全部不用改。
    </div>
  </div>

  <script>
    const ICONS = {
      precip: '<path d="M17.4 10.4a4.2 4.2 0 0 0-8.2-1.3 3.6 3.6 0 0 0 .3 7.1h7.1a3.2 3.2 0 0 0 .8-5.8z"/><path d="M9 18.5l-1 1.9M13 18.5l-1 1.9M17 18.5l-1 1.9"/>',
      humidity: '<path d="M12 3.5C8.8 7.6 7.3 10.1 7.3 12.6a4.7 4.7 0 0 0 9.4 0c0-2.5-1.5-5-4.7-9.1z"/><path d="M9 13a3 3 0 0 0 2.5 2.7"/>',
      wind: '<path d="M3.5 8.5h11a2.4 2.4 0 1 0-2.4-2.4M3.5 12.5h15.5M3.5 16.5h9"/>',
      uv: '<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v1.8M12 19.4v1.8M2.8 12h1.8M19.4 12h1.8M5.5 5.5l1.3 1.3M17.2 17.2l1.3 1.3M18.5 5.5l-1.3 1.3M6.8 17.2l-1.3 1.3"/>',
      temp: '<path d="M12 4.4a1.9 1.9 0 0 1 1.9 1.9v7.2a3.6 3.6 0 1 1-3.8 0V6.3A1.9 1.9 0 0 1 12 4.4z"/><path d="M10.1 9h3.8M10.1 11.9h3.8"/>',
      cloud: '<path d="M17.3 9.2a4.2 4.2 0 0 0-8.1-1.3 3.6 3.6 0 0 0 .3 7.1h7a3.2 3.2 0 0 0 .8-5.8z"/>',
    }
    const iconSvg = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">${path}</svg>`

    const GLYPH = {
      up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5V5M6 11l6-6 6 6"/></svg>',
      down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5V19M6 13l6 6 6-6"/></svg>',
      flat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.6h10M7 14.4h10"/></svg>',
    }

    const badge = (c) => {
      const cls = ['delta', c.dir, c.tone === 'mono' ? '' : 'tint'].filter(Boolean).join(' ')
      const num = c.text ? `<span class="delta-num">${c.text}<span class="delta-unit">${c.badgeUnit}</span></span>` : ''
      return `<span class="${cls}">${GLYPH[c.dir]}${num}</span>`
    }

    const tip = (c) => {
      if (!c.tip) return `<span class="tip"><span class="tip-body"><span class="tip-sub">${c.sub}</span></span></span>`
      return `<span class="tip"><span class="tip-body"><span class="tip-main">${c.tip}</span><span class="tip-sub">${c.sub}</span></span></span>`
    }

    const card = (c) => `<div class="stat">
        <span class="stat-icon">${iconSvg(ICONS[c.icon])}</span>
        <span class="stat-label">${c.label}</span>
        <span class="stat-foot">
          <span class="stat-value">${c.value}${c.unit ? `<small>${c.unit}</small>` : ''}</span>
          ${badge(c)}${tip(c)}
        </span>
      </div>`

    // 同一张卡：降雨量，今天 6.43 → 选中日 0.12（角标 ↓6.3mm）
    const BASE = {
      icon: 'precip', label: '降雨量', value: '0.12', unit: ' mm',
      dir: 'down', text: '6.3', badgeUnit: 'mm', tone: 'mono',
      sub: '今天 6.43 mm → 周二 0.12 mm',
    }

    const VARIANTS = [
      {
        tag: '现状', tagCls: 'now',
        tip: '相对今天，降雨量少 6.3 mm',
        cap: '四个字的套话 + 卡上已经写着的指标名。同一个句式在六张卡上走一遍，<b>眼睛第二次就把它当格式跳过了</b>；真正新的信息（差多少、差到什么程度）反而被这句套话挡在后面。',
        why: '「相对」二字尤其像报表：中文里说话不会用「相对今天」。',
      },
      {
        tag: 'B · 更短', tagCls: '',
        tip: '雨少了 6.3 mm',
        cap: '基准整个交给第二行（那里本来就有「今天 → 周二」），第一行<b>只用这个指标自己的说法</b>：雨 · 湿 · 风 · 晒 · 暖 · 云。六张卡读起来是六句话，而不是一句话念六遍。',
        why: '最短：8 字，浮层也跟着窄一截。代价是第一行离开第二行就少了主语 —— 读屏、截图、单独引用时会读成半句，所以最终没用它。',
      },
      {
        tag: 'C · 已采用', tagCls: 'pick',
        tip: '比今天少 6.3 mm',
        cap: '把基准留在第一行，但改成口语的<b>「比今天」</b>而不是「相对今天，」；指标名照样删掉——卡上的标签就在同一格里。第一行单独出现也读得通。',
        why: '信息量与现状完全一致，只换了语序和语气，风险最低；六张卡仍是六句不同的话（比今天少 / 低 / 小 / 弱 / 高），长度 11 字。',
      },
      {
        tag: 'D · 极简', tagCls: '',
        tip: '',
        cap: '不解释，只给证据：浮层退成<b>一行</b>，只留卡片和角标没说过的那个数（今天的原值）。差值已经写在角标上，再复述一遍是第三遍。',
        why: '最轻、最像 iOS；代价是 hover 时没有一句「结论」可读。',
      },
      {
        tag: 'E · 有表情', tagCls: '',
        tip: '只剩零头了',
        cap: '先给结论、再给数：把差值翻成人话。<b>问题是要定阈值</b>——「少一半」「只剩零头」各从几成算起，六个指标得一件件定，而且难免有一天判错。',
        why: '味道最好，维护成本最高；适合以后单独做一版「口语模式」。',
      },
    ]

    document.getElementById('variants').innerHTML = `
      <section class="sec">
        <div class="sec-head">
          <span class="sec-title">一、同一张卡，五种说法</span>
          <span class="sec-note">都是真实数字，读的时候想象鼠标停在角标上</span>
        </div>
        ${VARIANTS.map((v) => `
          <div class="row">
            ${card({ ...BASE, tip: v.tip })}
            <div class="cap-side">
              <span class="tag ${v.tagCls}">${v.tag}</span>
              <p class="cap">${v.cap}</p>
              <p class="why">${v.why}</p>
            </div>
          </div>`).join('')}
      </section>`

    // C 方案（已落地）落到六个指标（含持平），用截图里那天的数
    const FULL = [
      { icon: 'precip', label: '降雨量', value: '0.12', unit: ' mm', dir: 'down', text: '6.3', badgeUnit: 'mm', tone: 'mono', tip: '比今天少 6.3 mm', sub: '今天 6.43 mm → 周二 0.12 mm' },
      { icon: 'humidity', label: '湿度', value: '92', unit: ' %', dir: 'down', text: '5', badgeUnit: '%', tone: 'tint', tip: '比今天低 5 个点', sub: '今天 97% → 周二 92%' },
      { icon: 'wind', label: '风向风力', value: '西北风 0级', unit: '', dir: 'down', text: '2', badgeUnit: '级', tone: 'mono', tip: '比今天小 2 级', sub: '今天 南风 2级 → 周二 西北风 0级' },
      { icon: 'uv', label: '紫外线', value: '最弱', unit: '', dir: 'down', text: '', badgeUnit: '', tone: 'mono', tip: '比今天弱一档', sub: '今天 弱 → 周二 最弱' },
      { icon: 'temp', label: '平均温度', value: '20', unit: ' °C', dir: 'up', text: '2', badgeUnit: '°C', tone: 'tint', tip: '比今天高 2°C', sub: '今天 18°C → 周二 20°C' },
      { icon: 'cloud', label: '云量', value: '93', unit: ' %', dir: 'flat', text: '', badgeUnit: '', tone: 'mono', tip: '和今天一样', sub: '今天 93% → 周二 93%' },
    ]

    document.getElementById('full').innerHTML = `
      <section class="sec">
        <div class="sec-head">
          <span class="sec-title">二、C 方案落到六张卡</span>
          <span class="sec-note">箭头 / 冷暖色 / 精度都不动，只换说法；末位是持平态</span>
        </div>
        <div class="grid6">
          ${FULL.map((c) => card(c)).join('')}
        </div>
      </section>`
  </script>
</body>

</html>
