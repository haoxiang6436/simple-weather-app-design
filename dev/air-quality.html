<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>空气质量弹层 · 三版配色</title>
  <!-- 和 aqi-positions.html 一样锁 1920×1080 下的真实 rem（16px × 0.9），面板尺寸才和真机可比 -->
  <style>
    html {
      font-size: 14.4px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(120% 100% at 20% 0%, #16344a, #0b1720 70%);
    }

    /* 晨雾是浅色玻璃，压在深色页面上看不出面板边界，页面底色跟着换 */
    html[data-theme='mist'] body {
      background: radial-gradient(120% 100% at 20% 0%, #dce9f5, #a8c2d7 70%);
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/dev/airQualityPreview.js"></script>
</body>

</html>
