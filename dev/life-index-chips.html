<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生活指数 · 横条版预览（图标 + 名称并排，4×2）</title>

  <!--
    生活指数「横条版」离线预览 —— 单文件、零依赖，双击就能在浏览器里打开。

    目的：在真实卡片比例下判断「图标 + 名称并排」这一版能不能替代现在的
    「图标在上、名称在下」。所有尺寸都直接抄自
      src/features/weather/WeatherMain.vue  (.indices / .index-cell / .index-focus)
      src/style/index.scss                  (配色 token、html 字号缩放)
    除了 .index-cell 的排列方式和随之而来的几个尺寸，其余布局一个字都没改，
    所以这里看到的高度余量就是真实卡片里的高度余量。

    右上角控制条：
      · 布局   横条（本方案） / 图标在上（现状）—— 来回切就是 A/B
      · 条数   7 条（末行 4+3，走 stretch-last 拉伸） / 6 条（末行 4+2，居中不拉伸）
      · 预警   露出天气预警胶囊时的紧凑间距（.hero.hero-warning）
    控制条下方是实时量出来的选择器高度，省了多少 rem 一眼可见。

    字体说明：真实项目里 Montserrat 只覆盖拉丁字符，中文回落系统字体，
    所以这里不引 webfont，中文观感与卡片一致。
  -->

  <style>
    /* ================= 设计 token（抄自 src/style/index.scss :root） ================= */
    :root {
      --panel-scale: 0.9;

      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

      --color-primary: #65c7f2;
      --color-ok: #8cc8a6;
      --color-warn: #e3a36e;

      --glass-bg: rgba(13, 35, 59, 0.48);
      --glass-bg-soft: rgba(237, 247, 252, 0.075);
      --glass-border: rgba(237, 247, 252, 0.16);
      --glass-border-strong: rgba(237, 247, 252, 0.28);
      --glass-blur: min(1.625rem, 40px);

      --text-primary: #e8f2f8c2;
      --text-secondary: rgba(232, 242, 248, 0.76);
      --text-muted: rgba(232, 242, 248, 0.52);

      --radius-lg: 1.75rem;
      --radius-sm: 0.75rem;
      --shadow-card: 0 1.875rem 5rem -1.875rem rgba(0, 0, 0, 0.7), 0 0.125rem 0.5rem rgba(0, 0, 0, 0.28);

      --hero-gradient: linear-gradient(155deg, rgba(72, 182, 229, 0.28), rgba(101, 199, 242, 0.06) 55%, transparent);
      --hero-glow: radial-gradient(120% 90% at 18% -10%, rgba(101, 199, 242, 0.22), transparent 60%);

      --rain-chip-bg: rgba(101, 199, 242, 0.22);
      --rain-chip-border: rgba(101, 199, 242, 0.36);
      --rain-chip-text: #d8f2fc;
      --rain-chip-icon: #9cddf7;

      --chip-font-size: 0.875rem;
      --chip-font-weight: 600;
      --chip-line-height: 1.25;
      --chip-height: 2.375rem;
      --chip-pad-y: 0.5rem;
      --chip-pad-x: 0.75rem;
      --chip-gap: 0.5rem;
      --chip-icon-size: 1.15em;
      --chip-glass-blur: 0.75rem;
    }

    /* 与卡片完全一致的字号缩放：任意窗口下内部排版都按设计稿比例，不会被压扁 */
    html {
      font-size: clamp(6px,
          min(calc(0.833333vw * var(--panel-scale)),
            calc(1.481481vh * var(--panel-scale)),
            1.15vw,
            1.87vh),
          calc(40px * var(--panel-scale)));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text-primary);
      /* 示意用的「壁纸」：雾蓝夜景，只为了给玻璃卡一个底 */
      background:
        radial-gradient(120% 90% at 78% 12%, #2b4f66 0%, transparent 55%),
        radial-gradient(90% 70% at 12% 88%, #1c3a4e 0%, transparent 60%),
        linear-gradient(160deg, #0d2233 0%, #0a1824 55%, #071119 100%);
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* ================= 控制条（仅预览用，不属于卡片） ================= */
    .toolbar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      width: 15.5rem;
      padding: 0.75rem;
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--text-secondary);
      background: rgba(10, 26, 42, 0.82);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 0.75rem;
      box-shadow: 0 0.75rem 2rem -0.75rem rgba(0, 0, 0, 0.6);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .toolbar-row:last-of-type {
      margin-bottom: 0;
    }

    .toolbar-label {
      flex: none;
      width: 2.4em;
      color: var(--text-muted);
    }

    .seg {
      display: inline-flex;
      flex: 1;
      padding: 2px;
      background: rgba(237, 247, 252, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 0.5rem;
    }

    .seg button {
      flex: 1;
      padding: 0.28125rem 0.375rem;
      font-size: 0.72rem;
      white-space: nowrap;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 0.375rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .seg button[aria-pressed='true'] {
      color: #082238;
      background: #c0d6e1;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .switch input {
      accent-color: #c0d6e1;
    }

    .readout {
      margin-top: 0.625rem;
      padding-top: 0.5rem;
      font-size: 0.72rem;
      line-height: 1.6;
      color: var(--text-muted);
      border-top: 1px solid rgba(237, 247, 252, 0.1);
    }

    .readout b {
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .readout .save {
      color: var(--color-ok);
    }

    /* ================= 面板外壳（抄自 src/style/weather-panel.scss） ================= */
    .weather-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 3.5rem;
    }

    .weather-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      width: min(82vw, 71.25rem);
      height: min(46.5rem, 92vh);
      max-height: 92vh;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .weather-shell>* {
      grid-area: 1 / 1;
      min-width: 0;
      min-height: 0;
    }

    .weather-card {
      display: grid;
      grid-template-columns: minmax(15.625rem, 0.88fr) 1.6fr;
      width: 100%;
      height: 100%;
    }

    /* ================= 左栏（抄自 WeatherMain.vue 的 .hero 系列） ================= */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 1.625rem;
      padding: 2rem;
      background: var(--hero-gradient);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--hero-glow);
      pointer-events: none;
    }

    .hero.hero-warning {
      gap: 1.25rem;
    }

    .hero-top {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      min-height: 2.375rem;
      max-width: 100%;
      padding: 0.4375rem 0.8125rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--glass-bg-soft);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
    }

    .location svg {
      flex: none;
      width: 0.875rem;
      height: 0.875rem;
      color: var(--color-primary);
    }

    .api-entry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.125rem;
      height: 2.125rem;
      color: var(--text-muted);
      background: var(--glass-bg-soft);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
    }

    .api-entry svg {
      width: 1.1875rem;
      height: 1.1875rem;
    }

    .hero-date {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
    }

    .date-dayname {
      flex: none;
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text-primary);
    }

    .date-day {
      overflow: hidden;
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .hero-now {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .weather-icon {
      flex: none;
      width: 5rem;
      height: 5rem;
      color: var(--text-primary);
    }

    .now-temp {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    .now-temp-num {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .now-temp-unit {
      margin-left: 0.25rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .now-desc {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.125rem 0.625rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .now-desc-text {
      font-size: 1.4rem;
      line-height: 1.5;
    }

    .now-sub {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .now-sub-sep {
      width: 0.25rem;
      height: 0.25rem;
      border-radius: 50%;
      background: var(--text-muted);
    }

    /* ---- 状态胶囊（抄自 src/style/chips.scss + MinutelyRainChip） ---- */
    .hero-chips {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      min-width: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--chip-gap);
      width: fit-content;
      max-width: 100%;
      min-height: var(--chip-height);
      padding: var(--chip-pad-y) var(--chip-pad-x);
      overflow: hidden;
      font-size: var(--chip-font-size);
      font-weight: var(--chip-font-weight);
      line-height: var(--chip-line-height);
      text-align: left;
      color: var(--chip-text);
      background: var(--chip-bg);
      -webkit-backdrop-filter: blur(var(--chip-glass-blur)) saturate(140%);
      backdrop-filter: blur(var(--chip-glass-blur)) saturate(140%);
      border: var(--chip-border, 0);
      border-radius: var(--radius-sm);
    }

    .status-chip svg {
      flex: none;
      width: var(--chip-icon-size);
      height: var(--chip-icon-size);
      color: var(--chip-icon);
    }

    /* [hidden] 的 UA 规则是 display: none，但会被上面的 display: inline-flex 盖掉，
       这里补一条，否则「露出预警胶囊」的开关关着也会显示 */
    .status-chip[hidden] {
      display: none;
    }

    .minutely-chip {
      --chip-bg: var(--rain-chip-bg);
      --chip-border: 1px solid var(--rain-chip-border);
      --chip-text: var(--rain-chip-text);
      --chip-icon: var(--rain-chip-icon);
    }

    .warning-chip {
      --chip-bg: rgba(58, 155, 240, 0.26);
      --chip-border: 1px solid rgba(58, 155, 240, 0.34);
      --chip-text: #d6e9ff;
      --chip-icon: #8ec4ff;
    }

    /* ================= 生活指数 ================= */
    .indices {
      position: relative;
      z-index: 1;
      margin-top: 0.625rem;
    }

    .hero.hero-warning .indices {
      margin-top: 0.375rem;
    }

    .indices-title {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 4 列 × 2 行。用 flex 而不是 grid：末行 3 个时 .stretch-last 让它们撑满整行，
       6 条（4+2）时 justify-content 自动居中 —— 两种情况都不用分头写死。 */
    .indices-picker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    /* ★ 本方案唯一的「结构性」改动：column → row。
       其余尺寸都是围绕这一改动的收尾：
         · 图标 1.15rem → 1rem       给同一行里的名称让出宽度
         · line-height 锁 1          横条高度只由内边距 + 图标决定，不再被 CJK 默认行高撑开
         · 内边距 0.375 → 0.4375rem  横向排布后上下略给一点，避免文字贴边
       flex-basis 的 (100% - 1.5rem) / 4 与 stretch-last 规则原样保留。 */
    .index-cell {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.3125rem;
      /* 固定 4 列宽度：3 个 gap 占 1.5rem，剩下的四等分。
         末尾减 0.01px 抵消亚像素误差，避免第 4 个格子被挤到下一行、变成 3 列。 */
      flex: 0 0 calc((100% - 1.5rem) / 4 - 0.01px);
      min-width: 0;
      padding: 0.4375rem 0.25rem;
      font-size: 0.72rem;
      line-height: 1;
      color: var(--text-muted);
      background: var(--glass-bg-soft);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .index-cell:hover {
      border-color: var(--glass-border-strong);
    }

    .index-cell.active {
      color: var(--text-primary);
      background: var(--glass-bg-soft);
      border-color: var(--glass-border-strong);
    }

    .index-cell-icon {
      display: block;
      flex: none;
      width: 1rem;
      height: 1rem;
      color: var(--text-secondary);
    }

    .index-cell.tone-ok .index-cell-icon {
      color: var(--color-ok);
    }

    .index-cell.tone-warn .index-cell-icon {
      color: var(--color-warn);
    }

    .index-cell-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 末行恰好 3 个（7 条时是第 5 个起）→ 拉伸填满整行，右下角不留缺口。
       这一条与现状完全一致，横条版同样适用。 */
    .indices-picker.stretch-last .index-cell:nth-child(n + 5) {
      flex-grow: 1;
    }

    /* 露出预警胶囊时的紧凑模式：和现状同样是「按下一档内边距」，规则不变 */
    .hero.hero-warning .index-cell {
      padding: 0.3125rem 0.25rem;
    }

    /* ---- 聚焦卡（与现状一致） ---- */
    .index-focus {
      --focus-pad-x: 0.875rem;
      --focus-pad-y: 0.625rem;
      position: relative;
      margin-top: 0.5rem;
      min-height: 7rem;
      padding: var(--focus-pad-y) var(--focus-pad-x);
      background: var(--glass-bg-soft);
      border: 1px solid var(--glass-border);
      border-left: 0.1875rem solid var(--tone-color, var(--glass-border-strong));
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-left-color 0.2s ease;
    }

    .index-focus.tone-ok {
      --tone-color: var(--color-ok);
    }

    .index-focus.tone-warn {
      --tone-color: var(--color-warn);
    }

    .index-focus-head {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .index-focus-icon {
      display: block;
      flex: none;
      width: 1.15rem;
      height: 1.15rem;
      color: var(--tone-color, var(--text-secondary));
    }

    .index-focus-sep {
      color: var(--text-muted);
    }

    .index-focus-cat {
      color: var(--tone-color, var(--text-secondary));
    }

    .index-focus-text {
      display: -webkit-box;
      min-height: 4.8em;
      margin: 0.375rem 0 0;
      overflow: hidden;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-secondary);
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* ================= 右栏占位 ================= */
    .details {
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .details-note {
      max-width: 18rem;
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.7;
      text-align: center;
      color: rgba(232, 242, 248, 0.28);
    }

    /* ================= 「现状」对照：只还原排列方式与随之而来的尺寸 ================= */
    body.layout-columns .index-cell {
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.375rem 0.25rem;
      line-height: normal;
    }

    body.layout-columns .index-cell-icon {
      width: 1.15rem;
      height: 1.15rem;
    }

    body.layout-columns .hero.hero-warning .index-cell {
      padding: 0.3125rem 0.25rem;
    }

    /* 「把省下的高度补回间距」：横条省出约 2.5rem，如果觉得左栏底部太空，
       就按这个比例分回去（gap 每档 +0.4375rem × 5 段 ≈ 2.19rem，再给指数块 +0.3125rem）。
       只在横条布局、且没有预警胶囊时生效：
         · 图标在上那版本来就吃紧，再加就顶出卡片了；
         · 露出预警胶囊时（.hero-warning）把空间留给那颗胶囊，间距回到紧凑档。 */
    body.gap-compensated.layout-chips .hero:not(.hero-warning) {
      gap: 2.0625rem;
    }

    body.gap-compensated.layout-chips .hero:not(.hero-warning) .indices {
      margin-top: 0.9375rem;
    }

    @media (max-width: 880px) {
      .weather-card {
        grid-template-columns: 1fr;
      }

      .details {
        display: none;
      }

      .toolbar {
        width: 13rem;
      }
    }
  </style>
</head>

<body class="layout-chips">

  <!-- ================= 预览控制条 ================= -->
  <div class="toolbar" role="group" aria-label="预览控制">
    <div class="toolbar-row">
      <span class="toolbar-label">布局</span>
      <div class="seg" id="seg-layout">
        <button type="button" data-layout="chips" aria-pressed="true">横条（新）</button>
        <button type="button" data-layout="columns" aria-pressed="false">图标在上（现状）</button>
      </div>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">条数</span>
      <div class="seg" id="seg-count">
        <button type="button" data-count="7" aria-pressed="true">7 条 4+3</button>
        <button type="button" data-count="6" aria-pressed="false">6 条 4+2</button>
      </div>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">预警</span>
      <label class="switch">
        <input type="checkbox" id="toggle-warning" />
        露出预警胶囊（紧凑间距）
      </label>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">间距</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gap" />
        把省下的高度补回间距
      </label>
    </div>
    <div class="readout">
      选择器实测（rem）：<br />
      横条 单行 <b id="row-cell">—</b> · 整套 <b id="row-block">—</b><br />
      图标在上 单行 <b id="col-cell">—</b> · 整套 <b id="col-block">—</b>
      <span class="save" id="save-h"></span>
    </div>
  </div>

  <!-- ================= 卡片 ================= -->
  <div class="weather-layer">
    <div class="weather-shell">
      <section class="weather-card">
        <header class="hero" id="hero">
          <div class="hero-top">
            <button type="button" class="location">
              <svg viewBox="0 0 1024 1024" aria-hidden="true">
                <path fill="currentColor"
                  d="M512 938.666667c-53.333333 0-384-257.258667-384-469.333334S299.925333 85.333333 512 85.333333s384 171.925333 384 384-330.666667 469.333333-384 469.333334z m0-352c64.8 0 117.333333-52.533333 117.333333-117.333334s-52.533333-117.333333-117.333333-117.333333-117.333333 52.533333-117.333333 117.333333 52.533333 117.333333 117.333333 117.333334z" />
              </svg>
              <span>杭州 · 西湖区</span>
            </button>
            <button type="button" class="api-entry" aria-label="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                  stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3.1" />
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </g>
              </svg>
            </button>
          </div>

          <div class="hero-date">
            <h2 class="date-dayname">周五</h2>
            <span class="date-day">11月14日</span>
          </div>

          <div class="hero-now">
            <!-- 官方图标库 icons/100.svg（晴）内联，替代字体图标 -->
            <svg class="weather-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path
                d="M7.655 2.357a.5.5 0 0 0 .854-.353v-1.5a.5.5 0 0 0-1 0v1.5a.5.5 0 0 0 .146.353Zm-4.08 1.861c.06.026.126.039.191.039l.001-.001a.5.5 0 0 0 .355-.855l-1.064-1.06a.5.5 0 0 0-.707.708l1.062 1.06a.498.498 0 0 0 .162.11ZM.503 8.496h1.5a.5.5 0 1 0 0-1h-1.5a.5.5 0 0 0 0 1Zm1.914 5.221a.501.501 0 0 0 .631-.063l1.063-1.06a.5.5 0 0 0-.708-.707l-1.062 1.06a.5.5 0 0 0 .076.77Zm5.225 2.14a.5.5 0 0 0 .854-.354v-1.5a.5.5 0 0 0-1 0v1.5a.5.5 0 0 0 .146.354Zm5.467-2.084a.5.5 0 0 0 .544-.816l-1.06-1.06a.498.498 0 0 0-.832.152.5.5 0 0 0 .126.555l1.06 1.06a.496.496 0 0 0 .162.109Zm.893-5.263h1.5a.5.5 0 1 0 0-1h-1.5a.5.5 0 0 0 0 1Zm-2.031-4.327a.5.5 0 0 0 .633-.063l1.06-1.06a.5.5 0 1 0-.708-.708l-1.06 1.06a.5.5 0 0 0 .075.77Zm-6.466.075a4.5 4.5 0 1 1 5 7.484 4.5 4.5 0 0 1-5-7.484Zm4.445.832a3.5 3.5 0 1 0-3.89 5.82 3.5 3.5 0 0 0 3.89-5.82Z" />
            </svg>
            <div class="now-temp">
              <span class="now-temp-num">17</span>
              <span class="now-temp-unit">°C</span>
            </div>
          </div>

          <div class="now-desc">
            <span class="now-desc-text">晴</span>
            <span class="now-sub">
              <span>体感 16°</span>
              <span class="now-sub-sep"></span>
              <span>22° / 11°</span>
            </span>
          </div>

          <div class="hero-chips">
            <button type="button" class="status-chip minutely-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path
                  d="M17.4 10.4a4.2 4.2 0 0 0-8.2-1.3 3.6 3.6 0 0 0 .3 7.1h7.1a3.2 3.2 0 0 0 .8-5.8z" />
                <path d="M9 18.5l-1 1.9M13 18.5l-1 1.9M17 18.5l-1 1.9" />
              </svg>
              <span>12 分钟后雨停</span>
            </button>
            <button type="button" class="status-chip warning-chip" id="warning-chip" hidden>
              <svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true">
                <path
                  d="M527.94 64.862c-16.67-8.864-37.3-2.556-46.163 14.114L65.137 862.562c-8.864 16.67-2.558 37.3 14.112 46.163 16.67 8.864 37.3 2.557 46.164-14.114l416.64-783.585c8.864-16.67 2.556-37.3-14.114-46.164z m385.07 558.591L649.18 166.293c-13.401-23.192-47.151-22.653-59.72 0.986l-262.654 493.98c-12.57 23.639 5.713 51.964 32.578 50.06l526.535-36.913c25.047-1.664 39.67-29.165 27.092-50.953z" />
              </svg>
              <span>暴雨蓝色预警</span>
            </button>
          </div>

          <div class="indices">
            <div class="indices-title">生活指数</div>
            <div class="indices-picker" id="picker"></div>
            <div class="index-focus" id="focus"></div>
          </div>
        </header>

        <main class="details">
          <p class="details-note">右栏（指标卡 / 七日预报）此处省略<br />——预览只看左下角的「生活指数」</p>
        </main>
      </section>
    </div>
  </div>

  <script>
    /* ---------------- 图标：与 WeatherMain.vue 的 ICONS 完全一致 ---------------- */
    const ICONS = {
      sport: '<circle cx="15" cy="4.8" r="1.7"/><path d="M9 19.5l2.6-4.7-2.6-1.9 1.6-4 3 1.6 1.4 3.4h3.4"/><path d="M13.8 8.6l1.4 3.3M11.6 14.8l-2.4 4.6"/>',
      wash: '<path d="M5.4 12.8l1.1-3.2A2 2 0 0 1 8.4 8h7.2a2 2 0 0 1 1.9 1.4l1.1 3.4"/><rect x="4.5" y="12.5" width="15" height="3.2" rx="1.2"/><circle cx="7.6" cy="16.4" r="1.3"/><circle cx="16.4" cy="16.4" r="1.3"/><path d="M8 10.6h8"/>',
      dress: '<path d="M9 3.5l2.6 1.4 2.6-1.4 3.8 2.9-2.3 2.4-1.2-.5v8.7H9V8.3l-1.2.5L5.5 6.4 9 3.5z"/>',
      travel: '<rect x="5" y="9" width="14" height="9.5" rx="2"/><path d="M9.5 9V6.5a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5V9"/><path d="M9 13.5h.01M12 13.5h.01M15 13.5h.01"/>',
      comfort: '<path d="M9.5 13.6V5.8a2.5 2.5 0 0 1 5 0v7.8a4 4 0 1 1-5 0z"/><circle cx="12" cy="16" r="1.6"/>',
      uv: '<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v1.8M12 19.4v1.8M2.8 12h1.8M19.4 12h1.8M5.5 5.5l1.3 1.3M17.2 17.2l1.3 1.3M18.5 5.5l-1.3 1.3M6.8 17.2l-1.3 1.3"/>',
      flu: '<rect x="9.3" y="4.5" width="5.4" height="15" rx="1.2"/><rect x="4.5" y="9.3" width="15" height="5.4" rx="1.2"/>'
    }
    const iconSvg = (path, cls) =>
      `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">${path}</svg>`

    /* ---------------- 假数据：字段照抄和风 v7 /v7/indices/1d ---------------- */
    const TYPE_ICON = { 1: 'sport', 2: 'wash', 3: 'dress', 5: 'uv', 6: 'travel', 8: 'comfort', 9: 'flu' }
    const ALL = [
      { type: 1, name: '运动指数', category: '较适宜', tone: 'ok', text: '天气较好，较适宜进行户外运动，但早晚较凉，请适当增减衣物。' },
      { type: 2, name: '洗车指数', category: '适宜', tone: 'ok', text: '较适宜洗车，未来一天无雨，风力较小，擦洗一新的汽车至少能保持一天。' },
      { type: 6, name: '旅游指数', category: '适宜', tone: 'ok', text: '温度适宜，又有较弱降水和微风作伴，会给您的旅行带来意想不到的景象，适宜旅游，可不要错过机会呦！' },
      { type: 8, name: '舒适度指数', category: '舒适', tone: 'ok', text: '白天不太热也不太冷，风力不大，相信您在这样的天气条件下，应会感到比较清爽和舒适。' },
      { type: 3, name: '穿衣指数', category: '较冷', tone: 'warn', text: '建议着厚外套加毛衣等服装。年老体弱者宜着大衣、呢外套加羊毛衫。' },
      { type: 5, name: '紫外线指数', category: '强', tone: 'warn', text: '紫外线辐射较强，外出时建议涂擦 SPF 高于 30、PA++ 的防晒护肤品，并戴好遮阳帽。' },
      { type: 9, name: '感冒指数', category: '少发', tone: 'ok', text: '各项气象条件适宜，无明显降温过程，发生感冒机率较低。' }
    ]

    /* ---------------- 状态 ---------------- */
    const state = { layout: 'chips', count: 7, active: 6 }
    const items = () => ALL.slice(0, state.count)

    const pickerEl = document.getElementById('picker')
    const focusEl = document.getElementById('focus')
    const heroEl = document.getElementById('hero')

    const pick = (type) => {
      state.active = type
      render()
    }

    const render = () => {
      const list = items()

      // 4 列布下末行恰好 3 个才拉伸填满（与 WeatherMain.vue 的 stretchLastRow 同一判据）
      pickerEl.className = `indices-picker${list.length % 4 === 3 ? ' stretch-last' : ''}`

      pickerEl.innerHTML = list.map((idx) => {
        const active = idx.type === state.active ? ' active' : ''
        return `<button type="button" class="index-cell tone-${idx.tone}${active}"
            aria-pressed="${idx.type === state.active}" title="${idx.name}"
            data-type="${idx.type}">
            <span class="index-cell-icon">${iconSvg(ICONS[TYPE_ICON[idx.type]])}</span>
            <span class="index-cell-name">${idx.name.replace('指数', '')}</span>
          </button>`
      }).join('')

      const current = list.find((idx) => idx.type === state.active) || list[0]
      focusEl.className = `index-focus tone-${current.tone}`
      focusEl.innerHTML = `<div class="index-focus-head">
          <span class="index-focus-icon">${iconSvg(ICONS[TYPE_ICON[current.type]])}</span>
          <span class="index-focus-name">${current.name}</span>
          <span class="index-focus-sep">·</span>
          <span class="index-focus-cat">${current.category}</span>
        </div>
        <p class="index-focus-text">${current.text}</p>`
    }

    pickerEl.addEventListener('click', (event) => {
      const cell = event.target.closest('.index-cell')
      if (cell) pick(Number(cell.dataset.type))
    })

    /* ---------------- 控制条 ---------------- */
    const rem = () => Number.parseFloat(getComputedStyle(document.documentElement).fontSize)
    const fmt = (px) => `${(px / rem()).toFixed(2)}rem`
    const rowCellEl = document.getElementById('row-cell')
    const rowBlockEl = document.getElementById('row-block')
    const colCellEl = document.getElementById('col-cell')
    const colBlockEl = document.getElementById('col-block')
    const saveEl = document.getElementById('save-h')

    /* 量高度：两种排列各量一次（临时切 class 再还原），
       所以不管当前选的是哪种布局，读出来的都是同一组可比数字。 */
    const readPicker = () => {
      const cell = pickerEl.querySelector('.index-cell')
      return {
        cell: cell ? cell.getBoundingClientRect().height : 0,
        block: pickerEl.getBoundingClientRect().height
      }
    }

    const measure = () => {
      const wasColumns = document.body.classList.contains('layout-columns')

      document.body.classList.add('layout-columns')
      const column = readPicker()

      document.body.classList.remove('layout-columns')
      const chip = readPicker()

      document.body.classList.toggle('layout-columns', wasColumns)

      rowCellEl.textContent = fmt(chip.cell)
      rowBlockEl.textContent = fmt(chip.block)
      colCellEl.textContent = fmt(column.cell)
      colBlockEl.textContent = fmt(column.block)

      const rows = state.count > 4 ? 2 : 1
      saveEl.textContent = chip.cell && column.cell ? `（${rows} 行共省 ${fmt((column.cell - chip.cell) * rows)}）` : ''
    }

    const syncSeg = (container, key, value) => {
      container.querySelectorAll('button').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset[key] === String(value)))
      })
    }

    const gapToggle = document.getElementById('toggle-gap')

    document.getElementById('seg-layout').addEventListener('click', (event) => {
      const btn = event.target.closest('button')
      if (!btn) return
      state.layout = btn.dataset.layout
      document.body.classList.toggle('layout-columns', state.layout === 'columns')
      document.body.classList.toggle('layout-chips', state.layout === 'chips')
      // 「补回间距」只对横条版有意义：图标在上那版本来就吃紧
      gapToggle.disabled = state.layout === 'columns'
      syncSeg(event.currentTarget, 'layout', state.layout)
      measure()
    })

    document.getElementById('seg-count').addEventListener('click', (event) => {
      const btn = event.target.closest('button')
      if (!btn) return
      state.count = Number(btn.dataset.count)
      syncSeg(event.currentTarget, 'count', state.count)
      if (!items().some((idx) => idx.type === state.active)) state.active = items()[0].type
      render()
      measure()
    })

    document.getElementById('toggle-warning').addEventListener('change', (event) => {
      heroEl.classList.toggle('hero-warning', event.target.checked)
      document.getElementById('warning-chip').hidden = !event.target.checked
      measure()
    })

    gapToggle.addEventListener('change', (event) => {
      document.body.classList.toggle('gap-compensated', event.target.checked)
      measure()
    })

    render()
    measure()
    window.addEventListener('resize', measure)
  </script>
</body>
