<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="favicon.ico" />
    <title>极简天气🌦️QWeather</title>
    <!--
      Wallpaper Engine 壁纸属性监听器

      官方文档（Web Wallpaper Reference → User Properties → Reading property values）要求：
      window.wallpaperPropertyListener 必须「在任何事件之外、尽可能早」初始化为全局对象，
      否则壁纸加载时引擎下发的第一次属性（一次性包含全部属性的当前值）会被丢掉，
      用户在下拉框里选的背景就会「打不开」。

      所以这里在 <head> 里先把监听器挂到全局，并把收到的属性缓存进队列；
      应用挂载完成后由 src/features/wallpaper/properties.js 接管：
      先补发缓存里的属性，再把 applyUserProperties 挂到消费列表上接收后续变更。
    -->
    <script>
      window.__wallpaperPropertyQueue = [];
      window.__wallpaperPropertyConsumers = [];
      window.wallpaperPropertyListener = {
        applyUserProperties: function (properties) {
          window.__wallpaperPropertyQueue.push(properties);
          for (var i = 0; i < window.__wallpaperPropertyConsumers.length; i++) {
            try {
              window.__wallpaperPropertyConsumers[i](properties);
            } catch (error) {
              console.warn('[Wallpaper] 壁纸属性处理失败', error);
            }
          }
        },
      };
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but simple-weather-app-design doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
